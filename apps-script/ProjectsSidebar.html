<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Google Sans', Arial, sans-serif; font-size: 13px; color: #1a1a2e; background: #fff; }

.wrap { padding: 16px; }

.header { text-align: center; margin-bottom: 18px; }
.logo { font-size: 18px; font-weight: 700; color: #05467c; }
.tagline { font-size: 11px; color: #888; margin-top: 2px; }

.step-desc { font-size: 12px; color: #555; margin-bottom: 14px; line-height: 1.5; }

label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 4px; margin-top: 12px; }
input[type=text], textarea, select {
  width: 100%; padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px;
  font-size: 12px; color: #1a1a2e; outline: none; font-family: inherit;
}
input:focus, textarea:focus, select:focus { border-color: #03a6a5; }
textarea { resize: vertical; min-height: 70px; }

.btn-row { display: flex; gap: 8px; margin-top: 18px; }
.btn { padding: 9px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #03a6a5; color: #fff; flex: 1; }
.btn-primary:hover { background: #028888; }
.btn-primary:disabled { background: #bbb; cursor: not-allowed; }

.status { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 6px; line-height: 1.5; }
.ok      { background: #e8f5e9; color: #2e7d32; }
.error   { background: #fdecea; color: #b71c1c; }
.loading { background: #e3f2fd; color: #1565c0; }

.count-line { font-size: 11px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">FreelanceFlow</div>
    <div class="tagline">Manage Projects</div>
  </div>

  <div class="step-desc">Upwork profiles support up to 10 portfolio projects. Pick an existing one to edit, or add a new one below.</div>

  <label>Project</label>
  <select id="project-picker" onchange="loadProject()">
    <option value="">-- New Project --</option>
  </select>
  <div class="count-line" id="count-line"></div>

  <label>Project Name</label>
  <input type="text" id="proj-name" placeholder="e.g. E-commerce Sales Dashboard">

  <label>Description</label>
  <textarea id="proj-desc" placeholder="What the project was, tools used, outcome"></textarea>

  <label>Keywords</label>
  <input type="text" id="proj-kw" placeholder="comma-separated, e.g. power bi, dashboard, sql">

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-save" onclick="saveProject()">Save</button>
  </div>

  <div id="status"></div>

</div>

<script>
var projectCount = 0;

function status(id, msg, type) {
  document.getElementById(id).innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
}
function clearStatus() { document.getElementById('status').innerHTML = ''; }
function val(id) { return document.getElementById(id).value.trim(); }

function updateCountLine() {
  document.getElementById('count-line').textContent = projectCount + ' of 10 projects used';
}

function clearFields() {
  document.getElementById('proj-name').value = '';
  document.getElementById('proj-desc').value = '';
  document.getElementById('proj-kw').value = '';
}

function loadProjectList(selectAfter) {
  google.script.run
    .withSuccessHandler(function (names) {
      var picker = document.getElementById('project-picker');
      picker.innerHTML = '<option value="">-- New Project --</option>';
      names.forEach(function (name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        picker.appendChild(opt);
      });
      projectCount = names.length;
      updateCountLine();
      if (selectAfter) {
        picker.value = selectAfter;
      }
    })
    .withFailureHandler(function () {})
    .projects_getProjects();
}

function init() {
  loadProjectList();
}

function loadProject() {
  var name = val('project-picker') || document.getElementById('project-picker').value;
  clearStatus();
  if (!name) { clearFields(); return; }

  status('status', 'Loading...', 'loading');
  google.script.run
    .withSuccessHandler(function (r) {
      clearStatus();
      if (!r.ok) { status('status', r.message, 'error'); return; }
      document.getElementById('proj-name').value = r.name;
      document.getElementById('proj-desc').value = r.description;
      document.getElementById('proj-kw').value = r.keywords;
    })
    .withFailureHandler(function (e) {
      status('status', 'Error: ' + e.message, 'error');
    })
    .projects_getProjectDetails(name);
}

function saveProject() {
  var originalName = document.getElementById('project-picker').value;
  var name = val('proj-name');
  if (!name) { status('status', 'Project name is required.', 'error'); return; }

  var data = {
    originalName: originalName,
    name:         name,
    description:  val('proj-desc'),
    keywords:     val('proj-kw')
  };

  document.getElementById('btn-save').disabled = true;
  status('status', 'Saving...', 'loading');

  google.script.run
    .withSuccessHandler(function (r) {
      document.getElementById('btn-save').disabled = false;
      if (r.ok) {
        status('status', 'Saved.', 'ok');
        loadProjectList(name);
      } else {
        status('status', r.message, 'error');
      }
    })
    .withFailureHandler(function (e) {
      document.getElementById('btn-save').disabled = false;
      status('status', 'Error: ' + e.message, 'error');
    })
    .projects_saveProject(data);
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Google Sans', Arial, sans-serif; font-size: 13px; color: #1a1a2e; background: #fff; }

.wrap { padding: 16px; }

.header { text-align: center; margin-bottom: 18px; }
.logo { font-size: 18px; font-weight: 700; color: #05467c; }
.tagline { font-size: 11px; color: #888; margin-top: 2px; }

label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 4px; margin-top: 12px; }
label.sub { font-weight: 400; color: #555; margin-top: 6px; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #d0d0d0; border-radius: 6px;
  font-size: 12px; color: #1a1a2e; outline: none; font-family: inherit;
}
input:focus, select:focus, textarea:focus { border-color: #03a6a5; }
textarea { resize: vertical; min-height: 50px; }

.milestone-row { padding: 10px; border: 1px solid #e8e8e8; border-radius: 6px; background: #fafafa; margin-top: 8px; }
.milestone-num { font-size: 11px; font-weight: 700; color: #03a6a5; margin-bottom: 4px; }
.milestone-desc { font-size: 12px; color: #333; margin-bottom: 2px; }
.milestone-amount { font-size: 11px; color: #777; margin-bottom: 6px; }
.milestone-row textarea { min-height: 40px; margin-top: 6px; }

.entry-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 12px; }
.entry-row:last-child { border-bottom: none; }
.entry-date { color: #555; }
.entry-amount { font-weight: 600; color: #05467c; }
.recent-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 18px; margin-bottom: 6px; }

.section-divider { border-top: 1px solid #e8e8e8; margin-top: 18px; padding-top: 4px; }

.btn-row { display: flex; gap: 8px; margin-top: 18px; }
.btn { padding: 9px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #03a6a5; color: #fff; flex: 1; }
.btn-primary:hover { background: #028888; }
.btn-primary:disabled { background: #bbb; cursor: not-allowed; }
.btn-secondary { background: #eef1f3; color: #333; }
.btn-secondary:hover { background: #e0e4e7; }

.status { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: 6px; line-height: 1.5; }
.ok      { background: #e8f5e9; color: #2e7d32; }
.error   { background: #fdecea; color: #b71c1c; }
.loading { background: #e3f2fd; color: #1565c0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">FreelanceFlow</div>
    <div class="tagline">Log Contract Progress</div>
  </div>

  <label>Contract</label>
  <select id="job-picker" onchange="loadJob()">
    <option value="">-- Select a contract --</option>
  </select>

  <div id="fixed-panel" style="display:none">
    <label>Contract Status</label>
    <select id="fixed-contract-status" onchange="toggleEndedEarlyFields('fixed')">
      <option value="Active">Active</option>
      <option value="Completed">Completed</option>
      <option value="Ended Early">Ended Early</option>
    </select>
    <div id="fixed-ended-early-fields" style="display:none">
      <label class="sub">Amount Received</label>
      <input type="number" id="fixed-ended-amount" step="0.01">
      <label class="sub">Were funds released to you?</label>
      <select id="fixed-ended-released">
        <option value="N">No</option>
        <option value="Y">Yes</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="fixed-btn-save-status" onclick="saveContractStatus('Fixed')">Update Status</button>
    </div>

    <div class="section-divider"></div>
    <div id="milestone-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-milestones" onclick="saveMilestones()">Save</button>
    </div>
  </div>

  <div id="hourly-panel" style="display:none">
    <label>Contract Status</label>
    <select id="hourly-contract-status" onchange="toggleEndedEarlyFields('hourly')">
      <option value="Active">Active</option>
      <option value="Completed">Completed</option>
      <option value="Ended Early">Ended Early</option>
    </select>
    <div id="hourly-ended-early-fields" style="display:none">
      <label class="sub">Amount Received</label>
      <input type="number" id="hourly-ended-amount" step="0.01">
      <label class="sub">Were funds released to you?</label>
      <select id="hourly-ended-released">
        <option value="N">No</option>
        <option value="Y">Yes</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="hourly-btn-save-status" onclick="saveContractStatus('Hourly')">Update Status</button>
    </div>

    <div class="section-divider"></div>
    <label>Date</label>
    <input type="date" id="log-date">
    <label>Hours</label>
    <input type="number" id="log-hours" step="0.25">
    <label>Notes</label>
    <textarea id="log-notes"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-add-entry" onclick="addHourlyEntry()">Add Entry</button>
    </div>
    <div class="recent-title">Recent Entries</div>
    <div id="entry-list"></div>
  </div>

  <div id="status"></div>

</div>

<script>
function status(id, msg, type) {
  document.getElementById(id).innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
}
function clearStatus() { document.getElementById('status').innerHTML = ''; }
function discoveryId() { return document.getElementById('job-picker').value; }
function todayIso() { return new Date().toISOString().slice(0, 10); }

function init() {
  google.script.run
    .withSuccessHandler(function (jobs) {
      var picker = document.getElementById('job-picker');
      jobs.forEach(function (j) {
        var opt = document.createElement('option');
        opt.value = j.discoveryId;
        opt.textContent = j.label;
        picker.appendChild(opt);
      });
    })
    .withFailureHandler(function () {})
    .progress_getJobs();
}

function loadJob() {
  var id = discoveryId();
  clearStatus();
  document.getElementById('fixed-panel').style.display = 'none';
  document.getElementById('hourly-panel').style.display = 'none';
  if (!id) return;

  status('status', 'Loading...', 'loading');
  google.script.run
    .withSuccessHandler(function (r) {
      clearStatus();
      if (!r.ok) { status('status', r.message, 'error'); return; }

      if (r.contractType === 'Fixed') {
        document.getElementById('fixed-contract-status').value = r.status || 'Active';
        document.getElementById('fixed-ended-amount').value = '';
        document.getElementById('fixed-ended-released').value = 'N';
        toggleEndedEarlyFields('fixed');
        renderMilestones(r.milestones);
        document.getElementById('fixed-panel').style.display = 'block';
      } else if (r.contractType === 'Hourly') {
        document.getElementById('hourly-contract-status').value = r.status || 'Active';
        document.getElementById('hourly-ended-amount').value = '';
        document.getElementById('hourly-ended-released').value = 'N';
        toggleEndedEarlyFields('hourly');
        document.getElementById('log-date').value = todayIso();
        document.getElementById('log-hours').value = '';
        document.getElementById('log-notes').value = '';
        renderEntries(r.hourlyEntries);
        document.getElementById('hourly-panel').style.display = 'block';
      }
    })
    .withFailureHandler(function (e) {
      status('status', 'Error: ' + e.message, 'error');
    })
    .progress_getJobDetails(id);
}

function toggleEndedEarlyFields(prefix) {
  var value = document.getElementById(prefix + '-contract-status').value;
  document.getElementById(prefix + '-ended-early-fields').style.display = value === 'Ended Early' ? 'block' : 'none';
}

function renderMilestones(milestones) {
  var list = document.getElementById('milestone-list');
  list.innerHTML = '';
  milestones.forEach(function (m) {
    var div = document.createElement('div');
    div.className = 'milestone-row';
    div.innerHTML =
      '<div class="milestone-num">Milestone ' + m.milestoneNumber + '</div>' +
      '<div class="milestone-desc">' + m.description + '</div>' +
      '<div class="milestone-amount">$' + Number(m.amount).toFixed(2) + '</div>' +
      '<select class="ms-status" data-num="' + m.milestoneNumber + '">' +
      ['Pending', 'Funded', 'Delivered', 'Released'].map(function (s) {
        return '<option value="' + s + '"' + (s === m.status ? ' selected' : '') + '>' + s + '</option>';
      }).join('') +
      '</select>' +
      '<textarea class="ms-notes" data-num="' + m.milestoneNumber + '" placeholder="Notes">' + (m.notes || '') + '</textarea>';
    list.appendChild(div);
  });
}

function saveMilestones() {
  var id = discoveryId();
  var milestones = Array.from(document.querySelectorAll('.ms-status')).map(function (sel) {
    var num = sel.getAttribute('data-num');
    var notesEl = document.querySelector('.ms-notes[data-num="' + num + '"]');
    return { milestoneNumber: num, status: sel.value, notes: notesEl ? notesEl.value : '' };
  });

  document.getElementById('btn-save-milestones').disabled = true;
  status('status', 'Saving...', 'loading');

  google.script.run
    .withSuccessHandler(function (r) {
      document.getElementById('btn-save-milestones').disabled = false;
      if (r.ok) {
        status('status', 'Saved.', 'ok');
        loadJob();
      } else {
        status('status', r.message, 'error');
      }
    })
    .withFailureHandler(function (e) {
      document.getElementById('btn-save-milestones').disabled = false;
      status('status', 'Error: ' + e.message, 'error');
    })
    .progress_saveMilestones({ discoveryId: id, milestones: milestones });
}

function saveContractStatus(contractType) {
  var id     = discoveryId();
  var prefix = contractType === 'Fixed' ? 'fixed' : 'hourly';
  var newStatus = document.getElementById(prefix + '-contract-status').value;
  var btn    = document.getElementById(prefix + '-btn-save-status');

  btn.disabled = true;
  status('status', 'Saving...', 'loading');

  if (newStatus === 'Ended Early') {
    var data = {
      discoveryId:     id,
      contractType:    contractType,
      amountReceived:  document.getElementById(prefix + '-ended-amount').value,
      released:        document.getElementById(prefix + '-ended-released').value === 'Y'
    };
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        if (r.ok) { status('status', 'Contract ended early.', 'ok'); } else { status('status', r.message, 'error'); }
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        status('status', 'Error: ' + e.message, 'error');
      })
      .progress_endContractEarly(data);
    return;
  }

  google.script.run
    .withSuccessHandler(function (r) {
      btn.disabled = false;
      if (r.ok) {
        status('status', 'Status updated.', 'ok');
      } else {
        status('status', r.message, 'error');
      }
    })
    .withFailureHandler(function (e) {
      btn.disabled = false;
      status('status', 'Error: ' + e.message, 'error');
    })
    .progress_saveContractStatus({ discoveryId: id, contractType: contractType, status: newStatus });
}

function renderEntries(entries) {
  var list = document.getElementById('entry-list');
  list.innerHTML = '';
  if (!entries.length) {
    list.innerHTML = '<div class="entry-row"><span class="entry-date">No entries yet</span></div>';
    return;
  }
  entries.forEach(function (en) {
    var d = en.logDate ? new Date(en.logDate) : null;
    var dateLabel = d && !isNaN(d) ? (d.getMonth() + 1) + '/' + d.getDate() : '';
    var div = document.createElement('div');
    div.className = 'entry-row';
    div.innerHTML =
      '<span class="entry-date">' + dateLabel + ' -- ' + en.hoursLogged + 'h</span>' +
      '<span class="entry-amount">$' + Number(en.amount).toFixed(2) + '</span>';
    list.appendChild(div);
  });
}

function addHourlyEntry() {
  var id    = discoveryId();
  var hours = document.getElementById('log-hours').value;
  if (!hours) { status('status', 'Enter hours first.', 'error'); return; }

  var data = {
    discoveryId: id,
    logDate:     document.getElementById('log-date').value,
    hoursLogged: hours,
    notes:       document.getElementById('log-notes').value.trim()
  };

  document.getElementById('btn-add-entry').disabled = true;
  status('status', 'Saving...', 'loading');

  google.script.run
    .withSuccessHandler(function (r) {
      document.getElementById('btn-add-entry').disabled = false;
      if (!r.ok) { status('status', r.message, 'error'); return; }
      status('status', 'Entry added.', 'ok');
      document.getElementById('log-hours').value = '';
      document.getElementById('log-notes').value = '';
      document.getElementById('log-date').value = todayIso();
      renderEntries(r.hourlyEntries);
    })
    .withFailureHandler(function (e) {
      document.getElementById('btn-add-entry').disabled = false;
      status('status', 'Error: ' + e.message, 'error');
    })
    .progress_addHourlyEntry(data);
}

init();
</script>
</body>
</html>
